backend:
  name: github
  repo: SonOfMaaJo/portfolio
  branch: master
  base_url: https://cms-auth.vnaoussi-djoumessi.com
  auth_endpoint: auth

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "blog"
    label: "Articles du blog"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Date de publication", name: "pubDate", widget: "date", format: "YYYY-MM-DD" }
      - { label: "Date de mise à jour", name: "updatedDate", widget: "date", format: "YYYY-MM-DD", required: false }
      - { label: "Image de couverture", name: "heroImage", widget: "image", required: false }
      - { label: "Badge", name: "badge", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Contenu", name: "body", widget: "markdown" }
