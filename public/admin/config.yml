backend:
  name: github
  repo: SonOfMaaJo/portfolio
  branch: master
  base_url: https://cms-auth.vnaoussi-djoumessi.com
  auth_endpoint: auth

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "blog"
    label: "Articles du blog"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Date de publication", name: "pubDate", widget: "date", format: "YYYY-MM-DD" }
      - { label: "Date de mise à jour", name: "updatedDate", widget: "date", format: "YYYY-MM-DD", required: false }
      - { label: "Image de couverture", name: "heroImage", widget: "image", required: false }
      - { label: "Badge", name: "badge", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Contenu", name: "body", widget: "markdown" }

  - name: "site"
    label: "Contenu du site"
    files:
      - name: "site_data"
        label: "Projets, recherche, CV, contact"
        file: "src/data/site.json"
        fields:
          - label: "Informations de contact"
            name: "contactInfo"
            widget: "object"
            fields:
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Téléphone", name: "phone", widget: "string" }
              - { label: "Localisation", name: "location", widget: "string" }
              - { label: "GitHub", name: "github", widget: "string" }
              - { label: "LinkedIn", name: "linkedin", widget: "string" }
              - { label: "Google Scholar", name: "scholar", widget: "string" }
              - { label: "Résumé", name: "summary", widget: "text" }
          - label: "Compétences"
            name: "skills"
            widget: "list"
            fields:
              - { label: "Catégorie", name: "category", widget: "string" }
              - { label: "Items", name: "items", widget: "list" }
          - label: "Projets"
            name: "projects"
            widget: "list"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Technologies", name: "tech", widget: "list" }
              - { label: "Lien", name: "link", widget: "string" }
              - { label: "Type", name: "type", widget: "select", options: ["Recherche", "42 Paris"] }
              - { label: "Statut", name: "status", widget: "string", required: false }
          - label: "Publications"
            name: "publications"
            widget: "list"
            fields:
              - { label: "Année", name: "year", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Revue", name: "journal", widget: "string" }
              - { label: "DOI", name: "doi", widget: "string" }
              - { label: "Lien", name: "link", widget: "string" }
          - label: "Recherche en cours"
            name: "research"
            widget: "object"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Directeur", name: "director", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "PDF", name: "pdf", widget: "string" }
              - { label: "Code", name: "code", widget: "string" }
          - label: "Formation"
            name: "education"
            widget: "list"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "string" }
          - label: "Expérience"
            name: "experience"
            widget: "list"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
